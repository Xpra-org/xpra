# The printers are added to the cups server running in the `xpra-cups` container,
# which shares the pod's '/run' volume.

# Use the drivers provided by that cups server,
# without probing for them when the server starts, as it may not be running yet:
pdf-printer = lsb/usr/cupsfilters/Generic-PDF_Printer-PDF.ppd
postscript-printer = drv:///sample.drv/generic.ppd

# The applications run in the `apps` container, as a user with the same uid but a different name,
# so the printers are not restricted to the name of the user running the xpra server (`-u allow:$USER`),
# only the containers sharing the pod's '/run' volume can access the cups server:
add-printer-options = -E
add-printer-options = -o printer-is-shared=false
