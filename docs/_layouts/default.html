<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">

{% seo %}
    <link rel="stylesheet" href="{{ "/assets/css/style.css?v=" | append: site.github.build_revision | relative_url }}">
    <link rel="stylesheet" href="{{ "/pagefind/pagefind-component-ui.css" | relative_url }}">
    <meta data-pagefind-meta="title[content]" content="{{ page.title | default: site.title | escape }}">
    {% include head-custom.html %}
  </head>
  <body>
    <div class="container-lg px-3 my-5 markdown-body">
      {% if site.title and site.title != page.title %}
      <h1><a href="{{ "/" | absolute_url }}">{{ site.title }}</a></h1>
      {% endif %}

      <!-- the search index is generated by pagefind in the "Documentation site" workflow,
           without it (ie: with a plain `jekyll serve`) these elements remain empty -->
      <div class="docs-search">
        <pagefind-config bundle-path="{{ "/pagefind/" | relative_url }}" base-url="{{ "/" | relative_url }}"></pagefind-config>
        <pagefind-modal-trigger placeholder="Search the documentation" shortcut="/"></pagefind-modal-trigger>
        <pagefind-modal reset-on-close></pagefind-modal>
      </div>

      <div data-pagefind-body>
      {{ content }}
      </div>

      {% if site.github.private != true and site.github.license %}
      <div class="footer border-top border-gray-light mt-5 pt-3 text-right text-gray">
        This site is open source. {% github_edit_link "Improve this page" %}.
      </div>
      {% endif %}
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/anchor-js/4.1.0/anchor.min.js" integrity="sha256-lZaRhKri35AyJSypXXs4o6OPFTbTmUoltBbDCbdzegg=" crossorigin="anonymous"></script>
    <script>anchors.add();</script>
    <script src="{{ "/pagefind/pagefind-component-ui.js" | relative_url }}" type="module"></script>
  </body>
</html>
