name: xpra

on: [push, pull_request]

jobs:
  unittest:
    # `ubuntu-26.04` is still a public preview image, so it can be slow to
    # get scheduled and some of its tooling may be unstable:
    # https://github.com/actions/runner-images/issues/14226
    runs-on: ${{ matrix.runner }}
    # Explicit list of legs (rather than a full matrix product) so that each
    # variation is only tested once, against the interpreted baseline build:
    # * `baseline`: interpreted, backwards compatible - the required baseline
    # * `cythonize_more`: built with `--with-cythonize_more` so the concrete-type
    #   argument annotations become live runtime TypeError guards
    #   (Cython annotation_typing).
    #   Non-blocking for now: it may surface latent type mismatches to fix
    #   before it can be made required.
    # * `no-backwards-compatibility`: `XPRA_BACKWARDS_COMPATIBLE=0`, exercising
    #   the code paths that will remain once the legacy ones are removed
    # * `seccomp`: every xpra server / client / command started by the tests runs
    #   with `--seccomp=strict`, so a blocked syscall kills it and fails the test.
    #   Non-blocking for now, see `docs/Usage/Seccomp.md`.
    # * `seccomp-arm64`: the same, on arm64 - where the filters are not enabled by default
    #   until they have been validated there (see `get_default_seccomp` in `xpra/scripts/config.py`)
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "baseline"
            runner: "ubuntu-26.04"
            cythonize: "without"
            compat: "1"
            seccomp: ""
          - name: "cythonize_more"
            runner: "ubuntu-26.04"
            cythonize: "with"
            compat: "1"
            seccomp: ""
          - name: "no-backwards-compatibility"
            runner: "ubuntu-26.04"
            cythonize: "without"
            compat: "0"
            seccomp: ""
          - name: "seccomp"
            runner: "ubuntu-26.04"
            cythonize: "without"
            compat: "1"
            seccomp: "strict"
          - name: "seccomp-arm64"
            runner: "ubuntu-26.04-arm"
            cythonize: "without"
            compat: "1"
            seccomp: "strict"
    name: "unittest (${{ matrix.name }})"
    continue-on-error: ${{ matrix.cythonize == 'with' || matrix.seccomp != '' }}
    steps:
    - uses: actions/checkout@v7

    - name: "apt-get install"
      run: |
        # see docs/Build/Debian.md
        # ubuntu 26.04 has wlroots 0.19, so both the wayland client
        # and the wayland server backend are built here
        sudo apt-get update
        sudo apt-get -y install libx11-dev libxtst-dev libxcomposite-dev libxdamage-dev libxpresent-dev libxres-dev \
                libxkbfile-dev python3-dev pandoc libsystemd-dev libseccomp-dev \
                libgtk-3-dev python3-dev python3-cairo-dev python-gi-dev \
                xauth x11-xkb-utils xterm \
                xvfb python3-cairo python3-gi-cairo \
                libturbojpeg-dev libwebp-dev python3-pil \
                libx264-dev libvpx-dev libyuv-dev libavif-dev libopenh264-dev libaom-dev libpipewire-0.3-dev \
                python3-dbus python3-cryptography \
                python3-netifaces python3-scramp \
                python3-opengl \
                openssh-client sshpass python3-asyncssh python3-paramiko \
                python3-setproctitle python3-xdg python3-cups \
                libpam-dev xserver-xorg-dev xutils-dev xserver-xorg-video-dummy xvfb keyboard-configuration \
                python3-kerberos python3-gssapi python3-aioquic \
                python3-gst-1.0 \
                gstreamer1.0-pulseaudio gstreamer1.0-alsa \
                gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
                gstreamer1.0-plugins-ugly gstreamer1.0-plugins-bad gstreamer1.0-vaapi \
                liblz4-dev python3-lz4 \
                libbrotli-dev \
                libxxhash-dev libqrencode-dev \
                libdrm-dev libwayland-dev libwayland-bin wayland-protocols libxkbcommon-dev libpixman-1-dev \
                libwlroots-0.19-dev weston wl-clipboard wtype \
                python3-coverage \
                openssl \
                tigervnc-standalone-server tigervnc-viewer \
                x11-xserver-utils dbus-x11

    - name: Install less buggy Cython
      run: |
        sudo apt-get install -y python3-pip
        sudo pip3 install cython --break-system-packages

    - name: "Build/Install/Test"
      env:
        # honoured by tests/unittests/run -> setup.py install --${CYTHONIZE_MORE}-cythonize_more
        CYTHONIZE_MORE: ${{ matrix.cythonize }}
        # build the optional terminal client so its tests run:
        XPRA_BACKWARDS_COMPATIBLE: ${{ matrix.compat }}
        # honoured by tests/unittests/unit/server_test_util.py: adds `--seccomp=...` to every xpra command
        XPRA_TEST_SECCOMP: ${{ matrix.seccomp }}
      run: >
        python3 setup.py unittests
        --skip-fail unit.client.splash_test
        --skip-slow unit.client.x11_client_test
        --skip-fail unit.client.x11_client_paint_test
        --skip-slow unit.server.subsystem.startdesktop_option_test
        --skip-slow unit.x11.x11_server_test
        --skip-slow unit.server.server_auth_test
        --skip-slow unit.server.shadow_server_test
        --skip-slow unit.server.subsystem.start_option_test
        --skip-slow unit.server.subsystem.shadow_option_test

  openbsd:
    name: "unittest (openbsd)"
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
    - uses: actions/checkout@v7

    - name: Record the source information
      # the workspace is copied without `.git`, so `src_info.py` must be generated here
      run: python3 ./fs/bin/add_build_info.py src

    - name: Test in OpenBSD
      uses: vmactions/openbsd-vm@v1
      with:
        release: "7.9"
        prepare: |
          pkg_add -I rsync--
          pkg_add -I bash git py3-setuptools py3-cython py3-gobject3 py3-cairo py3-numpy py3-Pillow \
            py3-lz4 py3-brotli py3-cryptography py3-dbus py3-yaml py3-rencode \
            py3-gstreamer1 py3-opengl py3-paramiko py3-netifaces py3-setproctitle \
            py3-xdg py3-asyncssh py3-aioquic py3-gssapi gtk+3 \
            xxhash x264 libvpx libwebp libavif libde265 openh264 dav1d aom \
            libqrencode zstd libnotify xdg-utils
        run: |
          groupadd xpra 2>/dev/null || true
          useradd -m -g xpra -s /bin/ksh xpra 2>/dev/null || true
          WORKSPACE=$(cd "$GITHUB_WORKSPACE" && pwd -P)
          CI_WORKSPACE=/home/xpra/xpra-ci
          rm -rf "$CI_WORKSPACE"
          mkdir -p "$CI_WORKSPACE"
          rsync -a --exclude=.git --exclude=build --exclude=dist --exclude=socket-test \
            "$WORKSPACE/" "$CI_WORKSPACE/"
          chown -R xpra:xpra "$CI_WORKSPACE"
          printf 'cd "%s"\n' "$CI_WORKSPACE" > /tmp/xpra-tests.sh
          SCRIPT='export NTHREADS=2
          export XPRA_TEST_COVERAGE=0
          bash tests/unittests/run \
            --skip-fail unit.client.splash_test \
            --skip-slow unit.client.x11_client_test \
            --skip-slow unit.client.x11_client_paint_test \
            --skip-slow unit.server.subsystem.startdesktop_option_test \
            --skip-slow unit.x11.x11_server_test \
            --skip-slow unit.x11.gtk_bindings_test \
            --skip-slow unit.server.server_auth_test \
            --skip-slow unit.server.shadow_server_test \
            --skip-slow unit.server.subsystem.start_option_test \
            --skip-slow unit.server.subsystem.shadow_option_test
          '
          printf '%s\n' "$SCRIPT" >> /tmp/xpra-tests.sh
          chmod 755 /tmp/xpra-tests.sh
          su -l xpra < /tmp/xpra-tests.sh
